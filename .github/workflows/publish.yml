name: publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # 仓库 secret 未配置时为空，下面的发布步骤会跳过而不是失败。
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check

      - name: Publish to npm (idempotent)
        if: ${{ env.NPM_TOKEN != '' }}
        run: |
          PKG=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          set +e
          OUT=$(npm publish --access public 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          if [ $RC -ne 0 ]; then
            if echo "$OUT" | grep -q "cannot publish over the previously published versions"; then
              echo "::notice::$PKG@$VER already published, skipping"
              exit 0
            fi
            exit $RC
          fi
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}

      - name: Skip notice
        if: ${{ env.NPM_TOKEN == '' }}
        run: echo "::notice::NPM_TOKEN is not configured for this repository; npm publish skipped."
